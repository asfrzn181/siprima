<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiPrima — Masuk</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/overrides.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Agbalumo&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand">
      <img class="brand-logo" src="assets/images/logo-siprima.png" alt="Logo SiPrima">
      <svg class="brand-title" viewBox="0 0 360 80" aria-label="SiPRIMA" role="img">
        <defs>
          <linearGradient id="siprima-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F2B300" />
            <stop offset="100%" stop-color="#E8750F" />
          </linearGradient>
        </defs>
        <text x="0" y="62" font-family="Agbalumo, cursive" font-size="56" fill="#3CA0F0" stroke="url(#siprima-stroke)" stroke-width="2.5" paint-order="stroke fill">SiPRIMA</text>
      </svg>
      <div>
        <p class="eyebrow">BKPSDMD Bangka</p>
        <p class="brand-tagline">Aplikasi agenda surat masuk dan surat keluar.</p>
      </div>
      <p class="brand-footer">Profesional Responsif Integritas Melayani Akuntabel</p>
    </section>
    <section class="auth-form">
      <div class="auth-form-inner">
        <h2 id="judul-login">Masuk</h2>
        <span class="accent-line" aria-hidden="true"></span>
        <p class="muted">Akses hanya untuk akun internal yang terdaftar.</p>
        <form id="login-form" class="stack" novalidate>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
          <label for="password">Kata sandi</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="password-toggle" aria-label="Tampilkan kata sandi" data-visible="false">👁</button>
          </div>
          <button class="button primary" type="submit">Masuk</button>
          <p id="login-error" class="form-error" role="alert" hidden></p>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="assets/js/pages/login.js"></script>
</body>
</html>
