<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiPrima — Laporan</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/overrides.css">
  <style>
    .filter-grid { display: grid; grid-template-columns: repeat(3, 1fr) repeat(2, 1fr) auto; gap: 1rem; align-items: end; }
    .filter-grid label { display: grid; gap: .35rem; }
    .filter-actions { display: flex; gap: .5rem; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 1rem; margin-top: 1rem; }
    .badge.danger { color: #9b1c1c; background: #fee4e2; }
    .badge.warning { color: #7a4b0a; background: #fef3c7; }
    .compact { margin: .15rem 0; font-size: .85rem; }
    .results-panel { display: none; }
    .results-panel.visible { display: block; }
    .panel-heading .panel-actions { display: flex; gap: .5rem; align-items: center; }
    @media (max-width: 1100px) { .filter-grid { grid-template-columns: repeat(3, 1fr); } .filter-actions { grid-column: 1 / -1; } }
    @media (max-width: 700px) { .filter-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 480px) { .filter-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app-shell"></div>
  <main class="page-container">
    <section class="page-heading">
      <div>
        <p class="eyebrow">Laporan</p>
        <h1>Laporan Surat</h1>
        <p class="muted">Filter berdasarkan rentang tanggal dan ekspor ke Excel.</p>
      </div>
    </section>

    <section class="panel filter-panel">
      <form id="filter-form" class="filter-grid" novalidate>
        <label>Jenis
          <select name="jenis" id="jenis-select">
            <option value="keluar">Surat Keluar</option>
            <option value="masuk">Surat Masuk</option>
          </select>
        </label>
        <label>Tanggal mulai<input name="tglMulai" type="date" required></label>
        <label>Tanggal sampai<input name="tglSelesai" type="date" required></label>
        <label>Status
          <select name="status" id="status-select">
            <option value="semua">Semua</option>
            <option value="Aktif">Aktif</option>
            <option value="Dibatalkan">Dibatalkan</option>
          </select>
        </label>
        <label>Sifat
          <select name="sifat">
            <option value="semua">Semua</option>
            <option value="biasa">Biasa</option>
            <option value="rahasia">Rahasia</option>
          </select>
        </label>
        <div class="filter-actions">
          <button class="button primary" type="submit">Tampilkan</button>
          <button id="reset-button" class="button secondary" type="button">Reset</button>
        </div>
      </form>
    </section>

    <div id="stats-row" class="stat-grid" style="display: none; margin-top: 1rem;">
      <div class="stat-card"><span class="stat-label">Total Surat</span><strong id="stat-total">0</strong><small>dalam rentang tanggal</small></div>
      <div class="stat-card"><span class="stat-label" id="stat-label-active">Aktif / Baru</span><strong id="stat-active">0</strong><small id="stat-active-desc">status aktif atau baru</small></div>
      <div class="stat-card"><span class="stat-label" id="stat-label-closed">Dibatalkan / Selesai</span><strong id="stat-closed">0</strong><small id="stat-closed-desc">status dibatalkan atau selesai</small></div>
    </div>

    <section id="results-panel" class="panel results-panel">
      <div class="panel-heading">
        <div>
          <h2>Hasil laporan</h2>
          <p id="results-note" class="muted compact">Memuat…</p>
        </div>
        <div class="panel-actions">
          <button id="export-button" class="button secondary" type="button" disabled>Ekspor Excel</button>
          <button id="refresh-button" class="button secondary" type="button">Muat ulang</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="results-table">
          <thead id="results-thead"></thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
      <div class="pagination">
        <button id="prev-button" class="button secondary" type="button" disabled>Sebelumnya</button>
        <span id="page-label" class="muted">Halaman 1</span>
        <button id="next-button" class="button secondary" type="button" disabled>Berikutnya</button>
      </div>
    </section>
  </main>
  <script type="module" src="assets/js/pages/laporan.js"></script>
</body>
</html>
