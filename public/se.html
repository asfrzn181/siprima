<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiPrima — Surat Edaran</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/overrides.css">
  <link rel="stylesheet" href="assets/css/autocomplete.css">
  <style>
    .filter-grid{display:grid;grid-template-columns:2fr auto;gap:1rem;align-items:end}
    .filter-grid label{display:grid;gap:.35rem}
    .filter-actions{display:flex;gap:.5rem}
    .wide{grid-column:1/-1}
    @media(max-width:700px){.filter-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="app-shell"></div>
  <main class="page-container">
    <section class="page-heading">
      <div>
        <p class="eyebrow">Agenda</p>
        <h1>Surat Edaran</h1>
        <p class="muted">Kelola daftar Surat Edaran (SE).</p>
      </div>
      <button id="new-button" class="button primary" type="button" hidden>+ SE</button>
    </section>

    <section class="panel">
      <form id="filter-form" class="filter-grid">
        <label>Pencarian<input name="search" type="search" placeholder="Cari tentang, nomor, atau keterangan"></label>
        <div class="filter-actions">
          <button class="button primary" type="submit">Terapkan</button>
          <button id="reset-filter" class="button secondary" type="button">Reset</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <h2>Daftar SE</h2>
          <p id="list-note" class="muted"></p>
        </div>
        <div class="toolbar">
          <button id="export" class="button secondary" type="button">Ekspor Excel</button>
          <button id="refresh" class="button secondary" type="button">Muat ulang</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No. Urut</th>
              <th>Nomor SE</th>
              <th>SE Tentang</th>
              <th>Tanggal SE</th>
              <th>Keterangan</th>
              <th>Status</th>
              <th><span class="sr-only">Aksi</span></th>
            </tr>
          </thead>
          <tbody id="list-body"></tbody>
        </table>
      </div>
      <div class="pagination">
        <button id="prev" class="button secondary" type="button" disabled>Sebelumnya</button>
        <span id="page-label">Halaman 1</span>
        <button id="next" class="button secondary" type="button" disabled>Berikutnya</button>
      </div>
    </section>

    <section id="form-panel" class="panel" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="form-title">
        <div class="panel-heading">
          <div>
            <h2 id="form-title">Tambah SE</h2>
            <p class="muted">Isi data Surat Edaran.</p>
          </div>
          <button id="close-form" class="button secondary" type="button">Tutup</button>
        </div>
        <form id="form" class="form-grid">
        <input name="id" type="hidden">
        <label>Tanggal SE<input name="tanggal" type="date" required></label>
        <label class="wide">SE Tentang<input name="tentang" maxlength="200" required></label>
        <label class="wide">Nomor SE
          <input name="nomorGenerated" readonly placeholder="Nomor dibuat otomatis">
        </label>
        <label class="wide">Keterangan<textarea name="keterangan" rows="3" maxlength="1000"></textarea></label>
        <div class="form-actions wide">
          <button id="save" class="button primary" type="submit">Simpan</button>
          <button id="cancel-record" class="button secondary" type="button" hidden>Batalkan SE</button>
        </div>
        <p id="form-error" class="form-error wide" role="alert" hidden></p>
      </form>
      </div>
    </section>
  </main>
  <script type="module" src="assets/js/pages/se.js"></script>
</body>
</html>
